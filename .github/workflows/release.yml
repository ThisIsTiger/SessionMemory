name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: No placeholder repository path left
        run: |
          if grep -n 'OWNER/' install.sh INSTALL.md README.md; then
            echo "Replace OWNER/ with the real repository path before releasing." >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/session-memory-$os-$arch" ./cmd/session-memory
          done
          (cd dist && sha256sum session-memory-* > checksums.txt)
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
